<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jumpscare</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #startBtn {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      padding: 14px 24px;
      font-size: 18px;
      cursor: pointer;
    }

    #scene {
      position: fixed;
      inset: 0;
      display: none;
      overflow: hidden;
      background: black;
    }

    #jumpscareImg {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 300px;
      transform: translate(-50%, -50%) scale(0.05);
      opacity: 0;
      will-change: transform, opacity, filter;
      pointer-events: none;
    }

    .attack {
      animation: lunge 0.22s cubic-bezier(.05,.75,.2,1) forwards;
    }

    @keyframes lunge {
      0% {
        transform: translate(-50%, -50%) scale(0.05);
        opacity: 0;
        filter: blur(8px);
      }
      10% {
        opacity: 1;
      }
      100% {
        transform: translate(-50%, -50%) scale(8);
        opacity: 1;
        filter: blur(0);
      }
    }

    .flash {
      animation: flash 0.12s linear 2;
    }

    @keyframes flash {
      0% { background: black; }
      50% { background: white; }
      100% { background: black; }
    }
  </style>
</head>
<body>
  <button id="startBtn">Start</button>

  <div id="scene">
    <img id="jumpscareImg" src="oriechef.jpg" alt="Jumpscare image">
  </div>

  <audio id="jumpscareSound" preload="auto" src="bwaaaaa.mp3"></audio>

  <script>
    const startBtn = document.getElementById("startBtn");
    const scene = document.getElementById("scene");
    const img = document.getElementById("jumpscareImg");
    const sound = document.getElementById("jumpscareSound");

    function triggerJumpscare() {
      scene.style.display = "block";

      img.classList.remove("attack");
      scene.classList.remove("flash");
      void img.offsetWidth; // restart animation

      sound.currentTime = 0;
      sound.volume = 1;

      img.classList.add("attack");
      scene.classList.add("flash");

      sound.play().catch(err => {
        console.log("Audio could not autoplay:", err);
      });
    }

    startBtn.addEventListener("click", () => {
      startBtn.style.display = "none";

      // Demo delay
      setTimeout(triggerJumpscare, 2000);
    });
  </script>
</body>
</html>
