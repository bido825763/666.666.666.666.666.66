!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jumpscare</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    #startButton {
      position: absolute;
      z-index: 10;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 16px 28px;
      font-size: 18px;
      cursor: pointer;
    }

    #jumpscare {
      position: fixed;
      inset: 0;
      display: none;
      background: black;
      overflow: hidden;
    }

    #head {
      position: absolute;
      left: 50%;
      top: -300px;
      transform: translateX(-50%);
      width: 300px;
      height: auto;
      opacity: 1;
    }

    .fall {
      animation: fallDown 0.5s ease-in forwards;
    }

    @keyframes fallDown {
      from {
        top: -300px;
      }
      to {
        top: 50%;
        transform: translate(-50%, -50%);
      }
    }
  </style>
</head>
<body>
  <button id="startButton">Start</button>

  <div id="jumpscare">
    <img id="head" src="oriechef.jpg" alt="Head">
  </div>

  <audio id="scream" preload="auto">
    <source src="bwaaaaa.mp3" type="audio/mpeg">
  </audio>

  <script>
    const startButton = document.getElementById("startButton");
    const jumpscare = document.getElementById("jumpscare");
    const head = document.getElementById("head");
    const scream = document.getElementById("scream");

    function triggerJumpscare() {
      jumpscare.style.display = "block";

      // restart sound from beginning
      scream.currentTime = 0;
      scream.volume = 1.0;

      // start both at nearly the same moment
      head.classList.remove("fall");
      void head.offsetWidth; // force reflow so animation can restart
      head.classList.add("fall");

      scream.play().catch(err => {
        console.log("Audio blocked until user interaction:", err);
      });
    }

    startButton.addEventListener("click", () => {
      startButton.style.display = "none";

      // Example: wait 2 seconds, then trigger
      setTimeout(triggerJumpscare, 2000);
    });
  </script>
</body>
</html>
